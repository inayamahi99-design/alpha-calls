<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ALPHA Production House — Line 2 Client Intake</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --green:#00ff9d; --cyan:#22e6ff; --blue:#6aa8ff; --gold:#d4a54a; --gold2:#f7d37a;
      --orange:#ff9b42; --red:#ff3b4f; --line:rgba(0,255,157,.28); --text:#dfffee; --muted:#8bbfb0;
      --panel:rgba(3,7,6,.92);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      min-height:100vh; font-family:'Rajdhani',sans-serif; color:var(--text);
      background:
        linear-gradient(rgba(0,255,157,.055) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,157,.055) 1px,transparent 1px),
        radial-gradient(circle at 50% -10%,rgba(0,255,157,.16),transparent 38%),
        #030504;
      background-size:42px 42px,42px 42px,100% 100%,100% 100%; overflow-x:hidden;
    }
    .wrap{max-width:1480px;margin:0 auto;padding:28px}
    .topbar{
      border:1px solid var(--line); background:rgba(5,10,9,.92); display:grid;
      grid-template-columns:330px 1fr auto; align-items:center; gap:16px; padding:18px 22px;
      margin-bottom:18px; box-shadow:0 0 32px rgba(0,255,157,.09);
    }
    .logoText{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1}
    .alphaMain{
      font-family:'Orbitron',sans-serif; font-size:58px; font-weight:900; letter-spacing:4px;
      background:linear-gradient(180deg,#f7d37a 0%,#d4a54a 35%,#8b5a1e 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      text-shadow:0 0 10px rgba(212,165,74,.25),0 0 25px rgba(212,165,74,.15);
    }
    .alphaSub{font-family:'Orbitron',sans-serif;font-size:16px;letter-spacing:8px;color:#c89645;margin-top:4px}
    .title{text-align:center;font-family:'Orbitron',sans-serif;color:#75ffe0;font-size:24px;letter-spacing:1px;text-shadow:0 0 12px rgba(0,255,157,.45)}
    .sub{font-size:14px;color:var(--blue);letter-spacing:1px;text-align:center;margin-top:6px;text-transform:uppercase}
    .tabs{display:flex;gap:10px;margin-bottom:18px}
    .tab{flex:1;padding:14px;border:1px solid var(--line);background:#050b09;color:var(--muted);font-family:'Orbitron',sans-serif;cursor:pointer;letter-spacing:.8px}
    .tab.active{background:linear-gradient(90deg,rgba(0,255,157,.22),rgba(34,230,255,.11));color:var(--green)}
    .panel{border:1px solid var(--line);background:var(--panel);box-shadow:0 0 28px rgba(0,255,157,.08);padding:22px;margin-bottom:20px}
    .hide{display:none!important}
    h2{font-family:'Orbitron',sans-serif;color:#66ffe0;font-size:18px;letter-spacing:1px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:10px;text-transform:uppercase}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.col-3{grid-column:span 3}.col-4{grid-column:span 4}.col-6{grid-column:span 6}.col-8{grid-column:span 8}.col-12{grid-column:span 12}
    label{display:block;color:var(--cyan);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px}
    input,select,textarea{width:100%;background:#030706;color:#eafff6;border:1px solid rgba(34,230,255,.24);padding:12px 13px;font-family:'Rajdhani',sans-serif;font-size:17px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 12px rgba(0,255,157,.18)}
    textarea{min-height:105px;resize:vertical}
    .btn{border:1px solid var(--green);background:#06100c;color:var(--green);padding:12px 18px;font-family:'Orbitron',sans-serif;cursor:pointer;letter-spacing:.8px}
    .btn:hover{background:rgba(0,255,157,.11)} .btn.orange{border-color:var(--orange);color:var(--orange)} .btn.red{border-color:var(--red);color:#ff8d98}
    .actions{display:flex;justify-content:flex-end;gap:12px;margin-top:18px;flex-wrap:wrap}.status{margin-top:14px;padding:12px;border:1px solid var(--line);color:var(--green);background:rgba(0,255,157,.08)}
    .wizardTop{display:grid;grid-template-columns:330px 1fr;gap:18px}
    .steps{border:1px solid var(--line);background:rgba(0,0,0,.28);padding:12px;align-self:start;position:sticky;top:10px}
    .stepItem{padding:12px 10px;margin-bottom:7px;border-left:5px solid rgba(0,255,157,.35);color:#bdfde6;font-weight:800;letter-spacing:.5px;font-size:24px}
    .stepItem.active{border-left-color:var(--green);background:rgba(0,255,157,.13);color:var(--green)}
    .stepItem.done{color:#88b9aa;border-left-color:rgba(34,230,255,.28)}
    .progressOuter{height:9px;background:#020403;border:1px solid var(--line);margin-bottom:16px}
    .progressInner{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan));box-shadow:0 0 12px rgba(0,255,157,.5)}
    .fieldCard{max-width:820px;margin:auto;border:1px solid rgba(34,230,255,.22);background:rgba(0,255,157,.04);padding:28px;box-shadow:inset 0 0 40px rgba(0,255,157,.03)}
    .fieldCount{font-family:'Orbitron',sans-serif;color:var(--orange);font-size:13px;margin-bottom:12px}
    .fieldQuestion{font-family:'Orbitron',sans-serif;font-size:24px;color:#bcffe8;margin-bottom:18px}
    .mini{color:var(--muted);font-size:15px;margin-top:9px}
    .preview{margin-top:15px;border:1px solid rgba(34,230,255,.22);background:rgba(34,230,255,.05);padding:12px;color:#bdfff1;max-height:260px;overflow:auto;font-size:15px}
    .preview b{color:var(--orange)}
    .repeatBox{border:1px solid rgba(0,255,157,.25);background:rgba(0,255,157,.06);padding:18px;margin-top:14px}
    .repeatTitle{font-family:'Orbitron',sans-serif;color:var(--green);font-size:18px;margin-bottom:10px}
    .deadBanner{display:none;border:1px solid var(--red);background:rgba(255,59,79,.12);padding:12px;margin-bottom:16px;color:#ffdce0}
    .deadBanner.active{display:block}
    .deathBtn{border:1px solid var(--red);background:#140306;color:#ffd9dd;padding:10px 16px;font-family:'Orbitron',sans-serif;cursor:pointer}
    .deathBtn.active{background:var(--red);color:#fff}
    dialog{border:1px solid var(--red);background:#070606;color:var(--text);padding:0;max-width:560px;width:92%;box-shadow:0 0 40px rgba(255,59,79,.22)}
    dialog::backdrop{background:rgba(0,0,0,.72)} .modalHead{padding:14px 16px;background:rgba(255,59,79,.18);font-family:'Orbitron',sans-serif;color:#ff7b86;border-bottom:1px solid var(--red)}
    .modalBody{padding:16px}.modalFoot{padding:14px 16px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid rgba(255,59,79,.35)}
    @media(max-width:900px){.topbar{grid-template-columns:1fr;text-align:center}.logoText{align-items:center}.alphaMain{font-size:42px}.alphaSub{font-size:12px;letter-spacing:5px}.wizardTop{grid-template-columns:1fr}.steps{position:relative}.stepItem{font-size:18px}.col-3,.col-4,.col-6,.col-8,.col-12{grid-column:span 12}.tabs{flex-direction:column}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logoText"><div class="alphaMain">ALPHA</div><div class="alphaSub">PRODUCTION HOUSE</div></div>
    <div><div class="title">ALPHA PRODUCTION HOUSE</div><div class="sub">Line 2 Client Intake • Unlimited one-by-one records</div></div>
    <div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-target="#line1">LINE 1 INTAKE</button>
    <button class="tab" data-target="#line2">LINE 2 SECURE WIZARD</button>
  </div>

  <form id="line1" class="panel">
    <h2>Line 1 Basic Intake</h2>
    <div class="grid">
      <div class="col-4"><label>Line 1 Player ID *</label><select name="line1Id" id="l1_slot" required><option value="">Select Identifier</option></select></div>
      <div class="col-8"><label>Player Name *</label><input name="playerName" required></div>
      <div class="col-12"><label>Customer Profile</label><input name="customer"></div>
      <div class="col-6"><label>Contact Number</label><input name="number" type="tel"></div>
      <div class="col-6"><label>Language</label><select name="language"><option value="">Select</option><option>Hindi</option><option>English</option><option>Gujarati</option><option>Other</option></select></div>
      <div class="col-3"><label>Age</label><input name="age"></div>
      <div class="col-3"><label>Gender</label><select name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
      <div class="col-6"><label>Location</label><input name="location"></div>
      <div class="col-6"><label>Profession</label><input name="profession"></div>
      <div class="col-12"><label>Additional Notes</label><textarea name="remarks"></textarea></div>
    </div>
    <div class="actions"><button class="btn" type="submit">SUBMIT LINE 1</button></div>
    <div id="status1"></div>
  </form>

  <form id="line2" class="panel hide">
    <div class="deadBanner" id="deadBanner"><b>LINE 2 DEAD REPORT ACTIVE:</b> This client is marked dead/deceased. Dead report PDF can be downloaded below.</div>
    <div class="wizardTop">
      <aside class="steps" id="stepList"></aside>
      <main>
        <div class="progressOuter"><div class="progressInner" id="progressInner"></div></div>
        <div class="actions" style="justify-content:space-between;margin-top:0;margin-bottom:16px">
          <button class="deathBtn" type="button" id="deathBtn">MARK DEAD / DECEASED</button>
          <span><button class="btn" type="button" id="downloadPdfTop">DOWNLOAD LINE 2 PDF</button> <button class="btn red" type="button" id="deadPdfTop">DOWNLOAD DEAD REPORT PDF</button></span>
        </div>

        <section class="fieldCard">
          <div class="fieldCount" id="fieldCount"></div>
          <div class="fieldQuestion" id="fieldQuestion"></div>
          <div id="fieldInput"></div>
          <div class="mini" id="fieldHelp"></div>
          <div class="actions" id="fieldActions">
            <button class="btn orange" type="button" id="prevField">BACK</button>
            <button class="btn" type="button" id="nextField">NEXT</button>
          </div>
        </section>

        <div class="preview" id="livePreview"></div>

        <div class="actions">
          <button class="btn orange" type="button" id="saveDraft">SAVE DRAFT</button>
          <button class="btn orange" type="button" id="loadDraft">LOAD DRAFT</button>
          <button class="btn" type="button" id="downloadPdf">DOWNLOAD LINE 2 PDF</button>
          <button class="btn red" type="button" id="deadPdf">DOWNLOAD DEAD REPORT PDF</button>
        </div>
        <div id="status2"></div>
      </main>
    </div>
  </form>
</div>

<dialog id="deathDialog">
  <div class="modalHead">LINE 2 DEAD REPORT CONFIRMATION</div>
  <div class="modalBody">
    <label>Death Date</label><input type="date" id="deathDate"><br><br>
    <label>Reason Why This Client Is Dead *</label><textarea id="deathReason" placeholder="Mention clear reason here..."></textarea>
  </div>
  <div class="modalFoot"><button class="btn" type="button" id="cancelDeath">Cancel</button><button class="btn red" type="button" id="confirmDeath">Confirm Dead</button></div>
</dialog>

<script>
const SCRIPT_URL_LINE1='https://script.google.com/macros/s/AKfycbzjna6m4tmO2nN3f75P8iSSciwGUrN5CpGiBrjVdRGkCIFeOOyjfKJn6oskR6cnxrwzsw/exec';

const state={
  index:0,
  death:{status:'ACTIVE',date:'',reason:''},
  data:{},
  repeat:{key:null,fieldIndex:0,draft:{}},
  records:{family:[],calls:[],banks:[]}
};

const groups=[
  'Personal Identity',
  'Contact & Residence',
  'Work Related Information',
  'Family Members',
  'Call Section',
  'Bank Section',
  'Assets Section',
  'Final Review / PDF'
];

const repeatConfigs={
  family:{
    g:3,
    label:'Family Member',
    addText:'ADD ANOTHER FAMILY MEMBER',
    continueText:'CONTINUE TO CALL SECTION',
    fields:[
      {k:'member',q:'Member Name',type:'text'},
      {k:'age',q:'Age',type:'number'},
      {k:'job',q:'Job / Occupation',type:'text'},
      {k:'workTime',q:'Work / School Time',type:'text'},
      {k:'homeTime',q:'Home Time',type:'text'},
      {k:'workOff',q:'Work Off',type:'text'},
      {k:'remarks',q:'Remarks',type:'textarea'},
      {k:'expectedVisitors',q:'Expected Visitors',type:'text'}
    ]
  },
  calls:{
    g:4,
    label:'Call Record',
    addText:'ADD ANOTHER CALL RECORD',
    continueText:'CONTINUE TO BANK SECTION',
    fields:[
      {k:'relation',q:'Relation',type:'text'},
      {k:'time',q:'Call Time',type:'time'},
      {k:'reason',q:'Reason',type:'text'},
      {k:'duration',q:'Duration',type:'text'},
      {k:'platform',q:'Platform',type:'text'},
      {k:'c1',q:'1st Detail',type:'text'},
      {k:'c2',q:'2nd Detail',type:'text'},
      {k:'c3',q:'3rd Detail',type:'text'},
      {k:'c4',q:'4th Detail',type:'text'},
      {k:'c5',q:'5th Detail',type:'text'},
      {k:'c6',q:'6th Detail',type:'text'}
    ]
  },
  banks:{
    g:5,
    label:'Bank Account',
    addText:'ADD ANOTHER BANK ACCOUNT',
    continueText:'CONTINUE TO ASSETS SECTION',
    fields:[
      {k:'name',q:'Bank Name',type:'text'},
      {k:'singleJoint',q:'Single / Joint Account',type:'text'},
      {k:'type',q:'Account Type',type:'text'},
      {k:'year',q:'Opening Year',type:'number'},
      {k:'purpose',q:'Purpose',type:'text'},
      {k:'chequeBook',q:'Cheque Book',type:'select',opts:['','Y','N']},
      {k:'passbook',q:'Passbook',type:'select',opts:['','Y','N']},
      {k:'internetBanking',q:'Internet Banking',type:'select',opts:['','Y','N']},
      {k:'phoneBanking',q:'Phone Banking',type:'select',opts:['','Y','N']},
      {k:'upi',q:'UPI',type:'text'},
      {k:'phonepe',q:'PhonePe',type:'text'},
      {k:'googlepay',q:'GPay',type:'text'},
      {k:'closingBalance',q:'Closing Balance',type:'text'},
      {k:'fd',q:'FD Amount',type:'text'},
      {k:'distance',q:'Distance From Home',type:'text'}
    ]
  }
};

function oddIds(){return Array.from({length:50},(_,i)=>'X'+(i*2+1))}
function evenIds(){return Array.from({length:49},(_,i)=>'X'+(i*2+2))}
function assetFields(){
  return [
    'RD','Mutual Funds','Shares','Gold','Diamond','Silver','Vehicle','Real Estate','Cash','Crypto',
    'PPF','PF','EPF','GPF','Coins','Limited Books','Exp. Watches','Asset Notes'
  ].map((q,i)=>({kind:'normal',g:6,k:'asset_'+i,q,type:i===17?'textarea':'asset'}));
}

const flow=[
  {kind:'normal',g:0,k:'clientName',q:'Client Name *',type:'text',req:true},
  {kind:'normal',g:0,k:'dob',q:'Date of Birth',type:'date'},
  {kind:'normal',g:0,k:'age',q:'Age',type:'number'},
  {kind:'normal',g:0,k:'date',q:'Date',type:'date'},
  {kind:'normal',g:0,k:'time',q:'Time',type:'time'},
  {kind:'normal',g:0,k:'language',q:'Language',type:'select',opts:['','English','Hindi','Gujarati','Other']},
  {kind:'normal',g:0,k:'gender',q:'Gender',type:'select',opts:['','Male','Female','Other']},
  {kind:'normal',g:0,k:'line1',q:'Line 1',type:'select',opts:[''].concat(oddIds())},
  {kind:'normal',g:0,k:'line2',q:'Line 2',type:'select',opts:[''].concat(evenIds())},
  {kind:'normal',g:0,k:'line3',q:'Line 3',type:'select',opts:['','C1','C2']},
  {kind:'normal',g:0,k:'aadhaar',q:'Aadhaar Number',type:'text'},
  {kind:'normal',g:0,k:'nationality',q:'Nationality',type:'text'},
  {kind:'normal',g:0,k:'pob',q:'Place of Birth',type:'text'},

  {kind:'normal',g:1,k:'numberActive',q:'Number Active',type:'select',opts:['','Y','N']},
  {kind:'normal',g:1,k:'whatsapp',q:'WhatsApp',type:'select',opts:['','Y','N']},
  {kind:'normal',g:1,k:'phone1',q:'Phone Number',type:'tel'},
  {kind:'normal',g:1,k:'phone2',q:'2nd Number',type:'tel'},
  {kind:'normal',g:1,k:'emergencyNo',q:'Emergency Number',type:'tel'},
  {kind:'normal',g:1,k:'email',q:'Email',type:'email'},
  {kind:'normal',g:1,k:'thirdParty',q:'Third Party Y/N',type:'select',opts:['','Y','N']},
  {kind:'normal',g:1,k:'currentLocation',q:'Current Location',type:'text'},
  {kind:'normal',g:1,k:'currentAddress',q:'Current Address',type:'textarea'},

  {kind:'normal',g:2,k:'education',q:'Education',type:'select',opts:['','Uneducated','Higher Edu','Bachelor','Master','Doctor/PHD']},
  {kind:'normal',g:2,k:'workYN',q:'Work Status',type:'select',opts:['','Y','N']},
  {kind:'normal',g:2,k:'position',q:'Position',type:'text'},
  {kind:'normal',g:2,k:'employment',q:'Employment Type',type:'select',opts:['','Employed','Self-Employed','Student','Retired']},
  {kind:'normal',g:2,k:'workSince',q:'Working Since',type:'number'},
  {kind:'normal',g:2,k:'companyName',q:'Company Name',type:'text'},
  {kind:'normal',g:2,k:'charging',q:'Charging %',type:'number'},
  {kind:'normal',g:2,k:'plugin',q:'Plugin',type:'text'},
  {kind:'normal',g:2,k:'phoneModel',q:'Phone Model',type:'text'},
  {kind:'normal',g:2,k:'otherPhoneYN',q:'Other Phone Y/N',type:'select',opts:['','Y','N']},
  {kind:'normal',g:2,k:'laptopYN',q:'Laptop Y/N',type:'select',opts:['','Y','N']},
  {kind:'normal',g:2,k:'twoWheelerYN',q:'2-Wheeler Y/N',type:'select',opts:['','Y','N']},
  {kind:'normal',g:2,k:'fourWheelerYN',q:'4-Wheeler Y/N',type:'select',opts:['','Y','N']},
  {kind:'normal',g:2,k:'totalVehicle',q:'Total Vehicles',type:'number'},
  {kind:'normal',g:2,k:'height',q:'Height cm',type:'number'},
  {kind:'normal',g:2,k:'weight',q:'Weight kg',type:'number'},
  {kind:'normal',g:2,k:'colorTone',q:'Color Tone',type:'text'},
  {kind:'normal',g:2,k:'passportYN',q:'Passport Y/N',type:'select',opts:['','Y','N']},
  {kind:'normal',g:2,k:'voterIdYN',q:'Voter ID Y/N',type:'select',opts:['','Y','N']},
  {kind:'normal',g:2,k:'visaRejected',q:'Visa Rejected Y/N',type:'select',opts:['','Y','N']},
  {kind:'normal',g:2,k:'overstayYN',q:'Overstay Y/N',type:'select',opts:['','Y','N']},

  {kind:'normal',g:3,k:'marriage',q:'Marriage Y/N',type:'select',opts:['','Y','N']},
  {kind:'normal',g:3,k:'kids',q:'Kids',type:'select',opts:['','0','1','2','3','4','5+']},
  {kind:'normal',g:3,k:'dom',q:'Date of Marriage',type:'date'},
  {kind:'repeat',key:'family',g:3},

  {kind:'repeat',key:'calls',g:4},
  {kind:'repeat',key:'banks',g:5}
].concat(
  assetFields(),
  [{kind:'review',g:7,k:'finalReview',q:'Final Review — Download PDF or Dead Report',type:'review'}]
);

const qs=(s,p=document)=>p.querySelector(s);
const qsa=(s,p=document)=>[...p.querySelectorAll(s)];

for(let i=1;i<=99;i+=2) qs('#l1_slot').add(new Option('X'+i,'X'+i));

qsa('.tab').forEach(btn=>btn.onclick=()=>{
  qsa('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  qsa('form.panel').forEach(f=>f.classList.add('hide'));
  qs(btn.dataset.target).classList.remove('hide');
});

function currentItem(){return flow[state.index]}

function currentGroup(){
  const item=currentItem();
  return item.g;
}

function renderSteps(){
  let current=currentGroup();
  qs('#stepList').innerHTML=groups.map((n,i)=>
    '<div class="stepItem '+(i===current?'active':'')+' '+(i<current?'done':'')+'">'+
    String(i+1).padStart(2,'0')+' — '+n+'</div>'
  ).join('');
  qs('#progressInner').style.width=((state.index+1)/flow.length*100)+'%';
}

function inputHTML(field,val){
  if(field.type==='select'){
    return '<select id="currentField">'+field.opts.map(o=>'<option '+(o===val?'selected':'')+'>'+o+'</option>').join('')+'</select>';
  }
  if(field.type==='textarea'){
    return '<textarea id="currentField">'+(val||'')+'</textarea>';
  }
  if(field.type==='asset'){
    return '<select id="currentField"><option '+(val===''?'selected':'')+'></option><option '+(val==='Yes'?'selected':'')+'>Yes</option><option '+(val==='No'?'selected':'')+'>No</option></select><br><br><input id="currentAmount" value="'+(state.data[field.k+'_amount']||'')+'" placeholder="'+field.q+' Amount">';
  }
  return '<input id="currentField" type="'+field.type+'" value="'+(val||'')+'" placeholder="'+field.q+'">';
}

function renderField(){
  renderSteps();
  const item=currentItem();

  qs('#fieldActions').innerHTML='<button class="btn orange" type="button" id="prevField">BACK</button><button class="btn" type="button" id="nextField">NEXT</button>';

  if(item.kind==='repeat'){
    renderRepeat(item.key);
  }else if(item.kind==='review'){
    qs('#fieldCount').textContent='Final Step • '+groups[item.g];
    qs('#fieldQuestion').textContent=item.q;
    qs('#fieldInput').innerHTML='<div class="preview">'+previewHTML(true)+'</div>';
    qs('#fieldHelp').textContent='Download normal Line 2 PDF or Dead Report PDF from the buttons.';
    qs('#nextField').textContent='FINISH';
    qs('#prevField').style.display=state.index===0?'none':'inline-block';
  }else{
    let val=state.data[item.k]||'';
    qs('#fieldCount').textContent='Field '+(state.index+1)+' of '+flow.length+' • Step '+(item.g+1)+': '+groups[item.g];
    qs('#fieldQuestion').textContent=item.q;
    qs('#fieldInput').innerHTML=inputHTML(item,val);
    qs('#fieldHelp').textContent='Previous filled details stay visible below.';
    qs('#prevField').style.display=state.index===0?'none':'inline-block';
    qs('#nextField').textContent='NEXT';
  }

  bindNavButtons();
  refreshPreview();
}

function renderRepeat(key){
  const cfg=repeatConfigs[key];
  if(state.repeat.key!==key){
    state.repeat={key,fieldIndex:0,draft:{}};
  }

  const entries=state.records[key]||[];

  if(state.repeat.fieldIndex>=cfg.fields.length){
    qs('#fieldCount').textContent='Step '+(cfg.g+1)+': '+groups[cfg.g];
    qs('#fieldQuestion').textContent=cfg.label+' Saved';
    qs('#fieldInput').innerHTML=
      '<div class="repeatBox"><div class="repeatTitle">'+cfg.label+' '+entries.length+' saved successfully.</div>'+
      '<div>You can add unlimited records. Add 1, 7, 10, or as many as required.</div>'+
      '<br><b>Total saved:</b> '+entries.length+'</div>';
    qs('#fieldHelp').textContent='Choose Add More to enter another record one-by-one, or Continue to move to next section.';
    qs('#fieldActions').innerHTML=
      '<button class="btn orange" type="button" id="prevField">BACK</button>'+
      '<button class="btn" type="button" id="addMoreRepeat">'+cfg.addText+'</button>'+
      '<button class="btn orange" type="button" id="continueRepeat">'+cfg.continueText+'</button>';
    qs('#addMoreRepeat').onclick=()=>{state.repeat={key,fieldIndex:0,draft:{}};renderField()};
    qs('#continueRepeat').onclick=()=>{state.repeat={key:null,fieldIndex:0,draft:{}};state.index++;renderField()};
    qs('#prevField').onclick=()=>{state.repeat.fieldIndex=Math.max(0,cfg.fields.length-1);renderField()};
    return;
  }

  const field=cfg.fields[state.repeat.fieldIndex];
  let entryNo=entries.length+1;
  let val=state.repeat.draft[field.k]||'';

  qs('#fieldCount').textContent=cfg.label+' '+entryNo+' • Detail '+(state.repeat.fieldIndex+1)+' of '+cfg.fields.length+' • Step '+(cfg.g+1)+': '+groups[cfg.g];
  qs('#fieldQuestion').textContent=cfg.label+' '+entryNo+' — '+field.q;
  qs('#fieldInput').innerHTML=inputHTML(field,val);
  qs('#fieldHelp').textContent='This section supports unlimited records. Each record is filled one detail at a time.';
  qs('#prevField').style.display='inline-block';
  qs('#nextField').textContent=state.repeat.fieldIndex===cfg.fields.length-1?'SAVE '+cfg.label.toUpperCase():'NEXT';
}

function saveCurrent(){
  const item=currentItem();

  if(item.kind==='review') return true;

  if(item.kind==='repeat'){
    const cfg=repeatConfigs[item.key];
    if(state.repeat.fieldIndex>=cfg.fields.length) return true;

    const field=cfg.fields[state.repeat.fieldIndex];
    let el=qs('#currentField');
    let val=el?el.value.trim():'';
    state.repeat.draft[field.k]=val;

    return true;
  }

  let el=qs('#currentField');
  let val=el?el.value.trim():'';

  if(item.req && !val){
    alert('This field is required.');
    return false;
  }

  state.data[item.k]=val;

  if(item.type==='asset'){
    let amt=qs('#currentAmount');
    state.data[item.k+'_amount']=amt?amt.value.trim():'';
  }

  refreshPreview();
  return true;
}

function bindNavButtons(){
  let prev=qs('#prevField');
  let next=qs('#nextField');

  if(prev){
    prev.onclick=()=>{
      const item=currentItem();

      if(item.kind==='repeat'){
        const cfg=repeatConfigs[item.key];

        if(state.repeat.fieldIndex>0 && state.repeat.fieldIndex<cfg.fields.length){
          saveCurrent();
          state.repeat.fieldIndex--;
          renderField();
          return;
        }

        state.repeat={key:null,fieldIndex:0,draft:{}};
      }

      if(state.index>0){
        state.index--;
        renderField();
      }
    };
  }

  if(next){
    next.onclick=()=>{
      const item=currentItem();

      if(item.kind==='repeat'){
        if(!saveCurrent()) return;
        const cfg=repeatConfigs[item.key];

        if(state.repeat.fieldIndex<cfg.fields.length-1){
          state.repeat.fieldIndex++;
          renderField();
        }else{
          state.records[item.key].push({...state.repeat.draft});
          state.repeat.fieldIndex=cfg.fields.length;
          state.repeat.draft={};
          renderField();
        }
        return;
      }

      if(!saveCurrent()) return;

      if(state.index<flow.length-1){
        state.index++;
        renderField();
      }
    };
  }
}

function labelFor(k){
  let f=flow.find(x=>x.k===k);
  return f?f.q:k;
}

function recordsText(){
  return '<br><br><b>Family Members:</b> '+state.records.family.length+
    ' &nbsp; | &nbsp; <b>Call Records:</b> '+state.records.calls.length+
    ' &nbsp; | &nbsp; <b>Bank Accounts:</b> '+state.records.banks.length;
}

function previewHTML(full=false){
  let base=Object.entries(state.data)
    .filter(([k,v])=>v && !k.endsWith('_amount'))
    .map(([k,v])=>'<b>'+labelFor(k)+':</b> '+v)
    .join(' &nbsp; | &nbsp; ');

  let death=state.death.status==='DECEASED'
    ? '<div style="color:#ff8d98"><b>DEAD REPORT:</b> This client is dead. Date: '+(state.death.date||'-')+' Reason: '+(state.death.reason||'-')+'</div><br>'
    : '';

  return death+(base||'No data filled yet.')+recordsText()+(full?'<br><br><b>Unlimited repeat mode is active for Family, Call, and Bank sections.</b>':'');
}

function refreshPreview(){
  qs('#livePreview').innerHTML=previewHTML(false);
  qs('#deadBanner').classList.toggle('active',state.death.status==='DECEASED');
  qs('#deathBtn').classList.toggle('active',state.death.status==='DECEASED');
  qs('#deathBtn').textContent=state.death.status==='DECEASED'?'DEAD REPORT ACTIVE':'MARK DEAD / DECEASED';
}

qs('#deathBtn').onclick=()=>qs('#deathDialog').showModal();
qs('#cancelDeath').onclick=()=>qs('#deathDialog').close();

qs('#confirmDeath').onclick=()=>{
  let r=qs('#deathReason').value.trim();
  if(!r){alert('Please mention death reason.');return}
  state.death={status:'DECEASED',date:qs('#deathDate').value,reason:r};
  qs('#deathDialog').close();
  refreshPreview();
};

qs('#saveDraft').onclick=()=>{
  saveCurrent();
  localStorage.setItem('alpha_line2_unlimited_onebyone',JSON.stringify(state));
  msg('status2','Draft saved.');
};

qs('#loadDraft').onclick=()=>{
  let raw=localStorage.getItem('alpha_line2_unlimited_onebyone');
  if(!raw) return msg('status2','No draft found.');
  Object.assign(state,JSON.parse(raw));
  renderField();
  msg('status2','Draft loaded.');
};

qs('#downloadPdf').onclick=()=>generatePDF(false);
qs('#downloadPdfTop').onclick=()=>generatePDF(false);
qs('#deadPdf').onclick=()=>generatePDF(true);
qs('#deadPdfTop').onclick=()=>generatePDF(true);

function msg(id,t){
  let s=qs('#'+id);
  s.textContent=t;
  s.className='status';
  setTimeout(()=>s.textContent='',3000);
}

qs('#line1').addEventListener('submit',async e=>{
  e.preventDefault();
  msg('status1','Submitting Line 1 data...');
  try{
    await fetch(SCRIPT_URL_LINE1,{method:'POST',mode:'no-cors',body:new URLSearchParams(new FormData(e.target))});
    msg('status1','Line 1 submitted successfully.');
    e.target.reset();
  }catch(err){
    msg('status1','Submission may have failed. Please verify.');
  }
});

function normalRowsForGroup(groupIndex){
  return flow
    .filter(f=>f.kind==='normal' && f.g===groupIndex)
    .map(f=>{
      let v=state.data[f.k]||'';
      if(f.type==='asset' && state.data[f.k+'_amount']){
        v=(v||'Yes')+' | Amount: '+state.data[f.k+'_amount'];
      }
      return [f.q,v||'-'];
    });
}

function safeText(v){
  return (v===undefined || v===null || String(v).trim()==='') ? '-' : String(v).trim();
}

function checkPage(doc,y,need,m,pageW,pageH,dead){
  if(y+need>pageH-16){
    doc.addPage();
    pdfHeader(doc,dead,m,pageW,pageH);
    return 28;
  }
  return y;
}

function pdfHeader(doc,dead,m,pageW,pageH){
  doc.setFillColor(255,255,255);
  doc.rect(0,0,pageW,pageH,'F');

  doc.setFillColor(5,7,7);
  doc.rect(0,0,pageW,24,'F');

  doc.setDrawColor(0,255,157);
  doc.setLineWidth(.25);
  doc.rect(m,4,pageW-m*2,16);

  doc.setFont('helvetica','bold');
  doc.setFontSize(22);
  doc.setTextColor(212,165,74);
  doc.text('ALPHA',m+5,13);
  doc.setFontSize(6.8);
  doc.setCharSpace(1.6);
  doc.text('PRODUCTION HOUSE',m+5,18);
  doc.setCharSpace(0);

  doc.setTextColor(117,255,224);
  doc.setFontSize(13);
  doc.text('ALPHA PRODUCTION HOUSE',pageW/2,11,{align:'center'});
  doc.setTextColor(106,168,255);
  doc.setFontSize(7);
  doc.text(dead?'LINE 2 DEAD REPORT':'LINE 2 CLIENT INTAKE REPORT',pageW/2,17,{align:'center'});

  doc.setTextColor(dead?255:0,dead?80:255,dead?95:157);
  doc.setFontSize(8);
  doc.text(dead?'DEAD':'ALIVE',pageW-m-12,14,{align:'right'});
}

function addSection(doc,title,y,m,pageW,pageH,dead=false){
  y=checkPage(doc,y,12,m,pageW,pageH,dead);
  doc.setFillColor(5,7,7);
  doc.roundedRect(m,y,pageW-m*2,8,1.5,1.5,'F');
  doc.setDrawColor(0,255,157);
  doc.setLineWidth(.15);
  doc.roundedRect(m,y,pageW-m*2,8,1.5,1.5);
  doc.setTextColor(212,165,74);
  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  doc.text(title,m+3,y+5.3);
  return y+10;
}

function compactInfoTable(doc,y,title,rows,m,pageW,pageH,dead=false){
  const clean=rows.filter(r=>safeText(r[1])!=='-');
  if(clean.length===0) return y;
  y=addSection(doc,title,y,m,pageW,pageH,dead);
  const body=[];
  for(let i=0;i<clean.length;i+=2){
    const a=clean[i], b=clean[i+1]||['',''];
    body.push([a[0],safeText(a[1]),b[0]||'',b[0]?safeText(b[1]):'']);
  }
  doc.autoTable({
    startY:y,
    body,
    theme:'grid',
    margin:{left:m,right:m},
    tableWidth:pageW-m*2,
    styles:{fontSize:7.1,cellPadding:1.25,textColor:[20,35,30],lineColor:[15,159,109],lineWidth:.08,overflow:'linebreak',minCellHeight:4.6},
    alternateRowStyles:{fillColor:[234,255,245]},
    columnStyles:{0:{fontStyle:'bold',textColor:[0,120,85],fillColor:[218,248,235],cellWidth:42},1:{cellWidth:51},2:{fontStyle:'bold',textColor:[0,120,85],fillColor:[218,248,235],cellWidth:42},3:{cellWidth:pageW-m*2-135}}
  });
  return doc.lastAutoTable.finalY+4;
}

function compactRepeatTable(doc,y,title,records,columns,m,pageW,pageH,dead=false){
  if(!records || records.length===0) return y;
  y=addSection(doc,title,y,m,pageW,pageH,dead);
  const head=[columns.map(c=>c.h)];
  const body=records.map((rec,i)=>columns.map(c=>c.k==='_no'?String(i+1):safeText(rec[c.k])));
  doc.autoTable({
    startY:y,
    head,
    body,
    theme:'grid',
    margin:{left:m,right:m},
    tableWidth:pageW-m*2,
    styles:{fontSize:6.25,cellPadding:.95,textColor:[20,35,30],lineColor:[15,159,109],lineWidth:.07,overflow:'linebreak',minCellHeight:4.3},
    headStyles:{fillColor:[5,7,7],textColor:[0,255,157],fontStyle:'bold',halign:'center',fontSize:6.4},
    alternateRowStyles:{fillColor:[234,255,245]},
    columnStyles:columns.reduce((a,c,idx)=>{a[idx]={cellWidth:c.w||'auto'};return a;},{})
  });
  return doc.lastAutoTable.finalY+4;
}

function assetCompactTable(doc,y,m,pageW,pageH,dead=false){
  const assets=flow.filter(f=>f.kind==='normal' && f.g===6).map(f=>{
    let status=safeText(state.data[f.k]);
    let amount=safeText(state.data[f.k+'_amount']);
    return [f.q,status,amount];
  }).filter(r=>r[1]!=='-' || r[2]!=='-');
  if(assets.length===0) return y;
  y=addSection(doc,'07 — ASSETS SECTION',y,m,pageW,pageH,dead);
  doc.autoTable({
    startY:y,
    head:[['Asset','Status','Amount / Notes']],
    body:assets,
    theme:'grid',
    margin:{left:m,right:m},
    tableWidth:pageW-m*2,
    styles:{fontSize:6.6,cellPadding:1,textColor:[20,35,30],lineColor:[15,159,109],lineWidth:.07,minCellHeight:4.3},
    headStyles:{fillColor:[5,7,7],textColor:[0,255,157],fontStyle:'bold'},
    alternateRowStyles:{fillColor:[234,255,245]},
    columnStyles:{0:{fontStyle:'bold',textColor:[0,120,85],cellWidth:60},1:{cellWidth:32},2:{cellWidth:pageW-m*2-92}}
  });
  return doc.lastAutoTable.finalY+4;
}

function deadCompactBox(doc,y,m,pageW,pageH){
  y=addSection(doc,'DEAD REPORT CONFIRMATION',y,m,pageW,pageH,true);
  doc.autoTable({
    startY:y,
    head:[['Status','Death Date','Reason']],
    body:[['THIS CLIENT IS DEAD',safeText(state.death.date),safeText(state.death.reason)]],
    theme:'grid',
    margin:{left:m,right:m},
    styles:{fontSize:7,cellPadding:1.4,textColor:[20,35,30],lineColor:[255,60,80],lineWidth:.1},
    headStyles:{fillColor:[120,0,20],textColor:[255,255,255],fontStyle:'bold'},
    alternateRowStyles:{fillColor:[255,235,238]}
  });
  return doc.lastAutoTable.finalY+4;
}

function generatePDF(dead=false){
  saveCurrent();

  if(dead && state.death.status!=='DECEASED'){
    qs('#deathDialog').showModal();
    return;
  }

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
  const m=8,pageW=doc.internal.pageSize.getWidth(),pageH=doc.internal.pageSize.getHeight();
  let y=28;

  pdfHeader(doc,dead,m,pageW,pageH);

  if(dead){ y=deadCompactBox(doc,y,m,pageW,pageH); }

  y=compactInfoTable(doc,y,'01 — PERSONAL IDENTITY',normalRowsForGroup(0),m,pageW,pageH,dead);
  y=compactInfoTable(doc,y,'02 — CONTACT & RESIDENCE',normalRowsForGroup(1),m,pageW,pageH,dead);
  y=compactInfoTable(doc,y,'03 — WORK RELATED INFORMATION',normalRowsForGroup(2),m,pageW,pageH,dead);
  y=compactInfoTable(doc,y,'04 — FAMILY STATUS',normalRowsForGroup(3),m,pageW,pageH,dead);

  y=compactRepeatTable(doc,y,'04 — FAMILY MEMBERS',state.records.family,[
    {h:'#',k:'_no',w:8},{h:'Name',k:'member',w:31},{h:'Age',k:'age',w:12},{h:'Job',k:'job',w:30},{h:'Work/School',k:'workTime',w:27},{h:'Home',k:'homeTime',w:22},{h:'Off',k:'workOff',w:22},{h:'Remarks / Visitors',k:'remarks'}
  ],m,pageW,pageH,dead);

  y=compactRepeatTable(doc,y,'05 — CALL SECTION',state.records.calls,[
    {h:'#',k:'_no',w:8},{h:'Relation',k:'relation',w:25},{h:'Time',k:'time',w:18},{h:'Reason',k:'reason',w:42},{h:'Duration',k:'duration',w:20},{h:'Platform',k:'platform',w:24},{h:'Details 1-3',k:'c1',w:31},{h:'Details 4-6',k:'c4'}
  ],m,pageW,pageH,dead);

  y=compactRepeatTable(doc,y,'06 — BANK SECTION',state.records.banks,[
    {h:'#',k:'_no',w:7},
    {h:'Bank',k:'name',w:23},
    {h:'Single/Joint',k:'singleJoint',w:19},
    {h:'Type',k:'type',w:18},
    {h:'Year',k:'year',w:12},
    {h:'PhonePe',k:'phonepe',w:19},
    {h:'GPay',k:'googlepay',w:19},
    {h:'Closing Bal',k:'closingBalance',w:24},
    {h:'FD',k:'fd',w:18},
    {h:'Distance',k:'distance'}
  ],m,pageW,pageH,dead);

  y=assetCompactTable(doc,y,m,pageW,pageH,dead);

  const pages=doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    doc.setFillColor(5,7,7);
    doc.rect(0,pageH-10,pageW,10,'F');
    doc.setDrawColor(dead?255:0,dead?59:255,dead?79:157);
    doc.line(m,pageH-10,pageW-m,pageH-10);
    doc.setFont('helvetica','bold');
    doc.setTextColor(212,165,74);
    doc.setFontSize(7);
    doc.text('ALPHA PRODUCTION HOUSE',m,pageH-4);
    doc.setTextColor(dead?255:0,dead?80:255,dead?95:157);
    doc.text(dead?'DEAD REPORT':'ALIVE PDF',pageW/2,pageH-4,{align:'center'});
    doc.setTextColor(117,255,224);
    doc.text('Page '+i+' of '+pages,pageW-m,pageH-4,{align:'right'});

    const cambodiaNow = new Date().toLocaleString('en-GB', {
      timeZone: 'Asia/Phnom_Penh',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: true
    });

    doc.setFont('helvetica','normal');
    doc.setFontSize(5.5);
    doc.setTextColor(140,140,140);
    doc.text('Cambodia Time: '+cambodiaNow,m,pageH-1.8);
  }

  function safeFilePart(value,fallback){
    return (value||fallback).toString().trim().replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'') || fallback;
  }

  let clientName=safeFilePart(state.data.clientName,'CLIENT');
  let line1=safeFilePart(state.data.line1,'LINE1');
  let line2=safeFilePart(state.data.line2,'LINE2');
  doc.save(clientName+'_'+line1+'_'+line2+'_'+(dead?'DEAD':'ALIVE')+'.pdf');
  msg('status2',dead?'Dead Report PDF downloaded.':'Line 2 PDF downloaded.');
}

renderField();
</script>
